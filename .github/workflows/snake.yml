name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: '31 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c41e3a&color_dots=%23e9e9e9,%23f2b8b8,%23e06c75,%23c41e3a
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff4d4d&color_dots=%23161b22,%233d1417,%237a1f24,%23e23636

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
