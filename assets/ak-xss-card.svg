<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="ak-xss — XSS vulnerability finder">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e2424"/>
      <stop offset="0.35" stop-color="#c93030"/>
      <stop offset="1" stop-color="#ff4d4d"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.8" fill="#000000" opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="title">
      <text x="110" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="128" letter-spacing="6">AK-XSS</text>
    </clipPath>
  </defs>

  <rect width="1600" height="420" fill="#070404"/>

  <!-- corner brackets -->
  <g stroke="#5c1a1a" stroke-width="2" fill="none">
    <path d="M 42 30 h 80 M 42 30 v 54"/>
    <path d="M 1558 30 h -80 M 1558 30 v 54"/>
    <path d="M 42 390 h 80 M 42 390 v -54"/>
    <path d="M 1558 390 h -80 M 1558 390 v -54"/>
  </g>

  <text x="110" y="95" font-family="Consolas, 'Courier New', monospace" font-size="30" fill="#7d2b2b">~/arsenal/ak-xss</text>

  <g filter="url(#glow)">
    <text x="110" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="128" letter-spacing="6" fill="url(#t)">AK-XSS</text>
  </g>
  <g clip-path="url(#title)">
    <rect width="1600" height="420" fill="url(#scan)"/>
  </g>

  <text x="110" y="295" font-family="Consolas, 'Courier New', monospace" font-size="30" letter-spacing="9" fill="#ff9b9b">XSS VULNERABILITY FINDER</text>
  <text x="110" y="350" font-family="Consolas, 'Courier New', monospace" font-size="26" letter-spacing="3" fill="#8b6b6b">CUSTOM PAYLOADS · ENV-AWARE · BUILT FOR BUG BOUNTY</text>

  <!-- glowing bug icon -->
  <circle cx="1355" cy="210" r="118" stroke="#5c1a1a" stroke-width="2" fill="none"/>
  <g filter="url(#glow)" stroke="#ff4d4d" stroke-width="9" fill="none" stroke-linecap="round">
    <ellipse cx="1355" cy="228" rx="34" ry="52"/>
    <circle cx="1355" cy="152" r="20"/>
    <line x1="1355" y1="172" x2="1355" y2="280"/>
    <path d="M 1330 178 q -34 -14 -46 -44"/>
    <path d="M 1380 178 q 34 -14 46 -44"/>
    <path d="M 1324 212 q -40 -4 -62 -24"/>
    <path d="M 1386 212 q 40 -4 62 -24"/>
    <path d="M 1324 248 q -40 6 -60 30"/>
    <path d="M 1386 248 q 40 6 60 30"/>
  </g>
</svg>
